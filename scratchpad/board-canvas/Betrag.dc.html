<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #f5a623; } a:hover { color: #ec0016; }
  </style>
</helmet>

<div style="width: 660px; height: 500px; position: relative; overflow: hidden; background: #0c0d0f; font-family: 'Outfit', system-ui, sans-serif; color: #f5f5f4; display: flex; flex-direction: column; align-items: center; padding: 26px 0 0;">

  <span style="font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #5a6169;">Betrag angetippt</span>

  <!-- Unterkante der Karte, damit klar ist, wo die Zeile sitzt -->
  <div style="width: 430px; height: 54px; margin-top: 16px; border-radius: 22px 22px 0 0; background: linear-gradient(180deg, #15181b, #131518); box-shadow: inset 0 1px 0 rgba(255,255,255,.05);"></div>

  <div style="display: flex; align-items: center; gap: 10px; margin-top: 18px;">
    <span style="font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #5a6169;">Höchstgebot</span>
    <div style="display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 13px; background: rgba(255,255,255,.1); box-shadow: 0 0 0 1.5px rgba(255,255,255,.22);">
      <span style="font-family: 'Fira Sans Condensed', sans-serif; font-size: 34px; font-weight: 900; line-height: 1; color: #ffffff; font-variant-numeric: tabular-nums;">140.000</span>
      <span style="font-size: 14px;">🎫</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9aa3ac" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 13px; background: rgba(245,166,35,.12); opacity: .45;">
      <span style="font-family: 'Fira Sans Condensed', sans-serif; font-size: 20px; font-weight: 800; text-transform: uppercase; color: #f5a623;">Fahrgast 4</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>

  <!-- Das Feld klappt unter dem Betrag auf -->
  <div style="width: 396px; margin-top: 12px; border-radius: 18px; padding: 16px; background: #181b1f; box-shadow: 0 24px 54px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.06); display: flex; flex-direction: column; gap: 13px;">

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <div style="height: 46px; border-radius: 11px; background: rgba(255,255,255,.05); display: grid; place-items: center; font-size: 15px; font-weight: 800; color: #9aa3ac; font-variant-numeric: tabular-nums;">−5.000</div>
      <div style="height: 46px; border-radius: 11px; background: rgba(255,255,255,.05); display: grid; place-items: center; font-size: 15px; font-weight: 800; color: #9aa3ac; font-variant-numeric: tabular-nums;">−1.000</div>
      <div style="height: 46px; border-radius: 11px; background: rgba(236,0,22,.16); box-shadow: inset 0 0 0 1.5px rgba(236,0,22,.5); display: grid; place-items: center; font-size: 15px; font-weight: 800; color: #ffffff; font-variant-numeric: tabular-nums;">+1.000</div>
      <div style="height: 46px; border-radius: 11px; background: rgba(236,0,22,.16); box-shadow: inset 0 0 0 1.5px rgba(236,0,22,.5); display: grid; place-items: center; font-size: 15px; font-weight: 800; color: #ffffff; font-variant-numeric: tabular-nums;">+5.000</div>
    </div>

    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="flex: 1; height: 48px; border-radius: 11px; background: rgba(0,0,0,.45); display: flex; align-items: center; padding: 0 15px; gap: 9px;">
        <span style="font-family: 'Fira Sans Condensed', sans-serif; font-size: 22px; font-weight: 800; color: #ffffff; font-variant-numeric: tabular-nums;">140.000</span>
        <span style="width: 1.5px; height: 22px; background: #ec0016;"></span>
        <span style="margin-left: auto; font-size: 12px; color: #5a6169;">frei eingeben</span>
      </div>
      <div style="height: 48px; padding: 0 20px; border-radius: 11px; background: rgba(255,255,255,.06); display: flex; align-items: center; font-size: 14px; font-weight: 800; color: #9aa3ac;">Setzen</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #5a6169;">
      <span>Fahrgast 4 hat noch 0,7M</span>
      <span>Kartenwert 92.000</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
