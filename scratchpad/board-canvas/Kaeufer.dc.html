<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #f5a623; } a:hover { color: #ec0016; }
  </style>
</helmet>

<div style="width: 660px; height: 500px; position: relative; overflow: hidden; background: #0c0d0f; font-family: 'Outfit', system-ui, sans-serif; color: #f5f5f4; display: flex; flex-direction: column; align-items: center; padding: 26px 0 0;">

  <span style="font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: #5a6169;">Fahrgast angetippt</span>

  <div style="width: 430px; height: 40px; margin-top: 16px; border-radius: 22px 22px 0 0; background: linear-gradient(180deg, #15181b, #131518); box-shadow: inset 0 1px 0 rgba(255,255,255,.05);"></div>

  <div style="display: flex; align-items: center; gap: 10px; margin-top: 16px;">
    <span style="font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: #5a6169;">Höchstgebot</span>
    <div style="display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 13px; background: rgba(255,255,255,.055); opacity: .5;">
      <span style="font-family: 'Fira Sans Condensed', sans-serif; font-size: 34px; font-weight: 900; line-height: 1; color: #ffffff; font-variant-numeric: tabular-nums;">140.000</span>
      <span style="font-size: 14px;">🎫</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5a6169" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 13px; background: rgba(245,166,35,.2); box-shadow: 0 0 0 1.5px rgba(245,166,35,.55);">
      <span style="font-family: 'Fira Sans Condensed', sans-serif; font-size: 20px; font-weight: 800; text-transform: uppercase; color: #f5a623;">Fahrgast 4</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
    </div>
  </div>

  <!-- Wer bekommt sie? Liste, und darunter der Zuschlag -->
  <div style="width: 330px; margin-top: 12px; margin-left: 152px; border-radius: 18px; padding: 9px; background: #181b1f; box-shadow: 0 24px 54px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.06); display: flex; flex-direction: column; gap: 4px;">

    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 11px;">
      <span style="width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.08); color: #9aa3ac; font-size: 11px; font-weight: 800; display: grid; place-items: center;">1</span>
      <span style="flex: 1; font-size: 14.5px; font-weight: 700;">Fahrgast 1</span>
      <span style="font-size: 12.5px; color: #5a6169; font-variant-numeric: tabular-nums;">0,9M</span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 11px;">
      <span style="width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.08); color: #9aa3ac; font-size: 11px; font-weight: 800; display: grid; place-items: center;">2</span>
      <span style="flex: 1; font-size: 14.5px; font-weight: 700;">Fahrgast 2</span>
      <span style="font-size: 12.5px; color: #5a6169; font-variant-numeric: tabular-nums;">0,9M</span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 11px;">
      <span style="width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.08); color: #9aa3ac; font-size: 11px; font-weight: 800; display: grid; place-items: center;">3</span>
      <span style="flex: 1; font-size: 14.5px; font-weight: 700;">Fahrgast 3</span>
      <span style="font-size: 12.5px; color: #5a6169; font-variant-numeric: tabular-nums;">1,5M</span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 11px; background: rgba(245,166,35,.14);">
      <span style="width: 20px; height: 20px; border-radius: 50%; background: #f5a623; color: #0b0b0b; font-size: 11px; font-weight: 800; display: grid; place-items: center;">4</span>
      <span style="flex: 1; font-size: 14.5px; font-weight: 800; color: #f5a623;">Fahrgast 4</span>
      <span style="font-size: 12.5px; color: #9aa3ac; font-variant-numeric: tabular-nums;">0,7M</span>
    </div>

    <div style="height: 1px; margin: 5px 4px; background: rgba(255,255,255,.07);"></div>

    <div style="height: 48px; border-radius: 12px; background: #4ade80; display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 15px; font-weight: 800; color: #06210f;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-11"/></svg>
      Für 140.000 zuschlagen
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
